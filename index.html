<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b2118"><link rel="manifest" href="manifest.json"><title>Bloc de Notas Pro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}body{background:#21140f;display:flex;justify-content:center}
.app{width:min(100vw,540px);height:100dvh;position:relative;overflow:hidden;background:url("notebook-background.jpg") center/100% 100% no-repeat}
.content{position:absolute;inset:6.5% 8% 3.5%;display:flex;flex-direction:column}
.top{display:flex;align-items:center}.top h1{margin:0;color:#17120d;font-size:28px;flex:1}.icon{border:0;background:transparent;font-size:21px;width:42px;height:42px}
.meta{font-size:12px;color:#5c4834;margin:0 0 5px}#search{display:none;width:100%;height:40px;margin-bottom:6px;border:1px solid #8d6848;border-radius:10px;background:#fff9e8cc;padding:0 12px;font-size:15px}
#notes{flex:1;overflow:auto}.note{padding:8px 0 7px;border-bottom:1px solid #80654b88;color:#17120d}.head{display:flex;align-items:center}.title{font-weight:bold;font-size:16px;flex:1}.body{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.3}.date{font-size:10px;color:#6d5a46;margin-top:3px}.actions button{border:0;background:transparent;font-size:17px;width:32px;height:32px}
.empty{text-align:center;color:#67513b;font-size:14px;margin-top:22px}.composer{margin-top:7px;background:#fff9e8;border:2px solid #9a6b43;border-radius:13px;padding:7px 10px;box-shadow:0 2px 5px #0002}
.row{display:flex;gap:6px;align-items:center}.composer input,.composer textarea{width:100%;border:0;outline:0;background:transparent;color:#211a12}.composer input{font-weight:bold;font-size:15px}.composer textarea{resize:none;height:48px;font-size:15px;padding-top:5px}
#add{width:46px;height:46px;border:0;background:transparent;font-size:31px;color:#17120d}
</style></head><body><main class="app"><section class="content">
<div class="top"><button class="icon" id="searchBtn">🔎</button><h1>Bloc de Notas</h1><button class="icon" id="clearBtn">🗑</button></div>
<div class="meta" id="meta">0 notas</div><input id="search" placeholder="Buscar en tus notas..."><div id="notes"></div>
<div class="composer"><div class="row"><input id="title" maxlength="80" placeholder="Título (opcional)"><button id="add">+</button></div>
<textarea id="body" maxlength="2000" placeholder="Escribe una nota..."></textarea></div>
</section></main>
<script>
const K="bloc_notas_pro_v3";let notes=JSON.parse(localStorage.getItem(K)||"[]");
const E=id=>document.getElementById(id), box=E("notes"),q=E("search"),title=E("title"),body=E("body");
function save(){localStorage.setItem(K,JSON.stringify(notes))}
function date(x){return new Date(x).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})}
function render(){let s=q.value.trim().toLowerCase();let list=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(s));box.innerHTML="";
E("meta").textContent=notes.length+(notes.length==1?" nota":" notas");
if(!list.length){box.innerHTML='<div class="empty">'+(s?"No se encontraron notas.":"Tus notas aparecerán aquí.")+"</div>";return}
list.forEach(n=>{let i=notes.indexOf(n),r=document.createElement("article");r.className="note";
r.innerHTML='<div class="head"><div class="title"></div><div class="actions"><button class="edit">✏️</button><button class="del">🗑️</button></div></div><div class="body"></div><div class="date"></div>';
r.querySelector(".title").textContent=n.title||"Sin título";r.querySelector(".body").textContent=n.body;r.querySelector(".date").textContent=date(n.updated);
r.querySelector(".edit").onclick=()=>{title.value=n.title;body.value=n.body;notes.splice(i,1);save();render();body.focus()};
r.querySelector(".del").onclick=()=>{notes.splice(i,1);save();render()};box.append(r)})}
function add(){let t=title.value.trim(),b=body.value.trim();if(!t&&!b){body.focus();return}notes.unshift({title:t,body:b,updated:Date.now()});title.value="";body.value="";save();render()}
E("add").onclick=add;body.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")add()};q.oninput=render;
E("searchBtn").onclick=()=>{q.style.display=q.style.display=="none"?"block":"none";render()};
E("clearBtn").onclick=()=>{if(notes.length&&confirm("¿Borrar todas las notas?")){notes=[];save();render()}};
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
